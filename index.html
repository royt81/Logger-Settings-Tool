<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mnemosyne</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
<link rel="shortcut icon" href="favicon/favicon.ico">
<link rel="manifest" href="favicon/site.webmanifest">
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --card:#ffffff; --border:#e4e7ec;
    --text:#1a1f27; --muted:#667085; --accent:#2563eb; --accent-hover:#1d4ed8;
    --accent-soft:#e8effd; --danger:#dc2626; --danger-soft:#fdecec;
    --ok:#16a34a; --warn:#b45309; --warn-border:#f5c97b;
    --input-bg:#ffffff; --hover:#f0f2f5; --code-bg:#f9fafb;
    --shadow:0 1px 3px rgba(16,24,40,.07), 0 1px 2px rgba(16,24,40,.05);
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  [data-theme="dark"]{
    --bg:#0f1115; --panel:#151920; --card:#1a1f27; --border:#2a303a;
    --text:#e6e8eb; --muted:#8b93a1; --accent:#4c8dff; --accent-hover:#6da3ff;
    --accent-soft:rgba(76,141,255,.14); --danger:#f87171; --danger-soft:rgba(248,113,113,.12);
    --ok:#4ade80; --warn:#fbbf24; --warn-border:#8a6d1f;
    --input-bg:#12161c; --hover:#222833; --code-bg:#12161c;
    --shadow:none;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); display:flex; min-height:100vh;
    transition:background .2s,color .2s;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:250px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:11px; padding:20px 18px 16px;}
  .brand-logo{
    width:34px; height:34px; border-radius:9px; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px;
    flex-shrink:0;
  }
  .brand-name{font-size:15px; font-weight:700; line-height:1.2;}
  .brand-sub{font-size:11px; color:var(--muted);}
  .nav{flex:1; overflow-y:auto; padding:6px 10px;}
  .nav-label{
    font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); padding:14px 10px 5px;
  }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px;
    cursor:pointer; color:var(--muted); font-size:13.5px; user-select:none; border:none;
    background:none; width:100%; text-align:left; font-family:inherit;
  }
  .nav-item:hover{background:var(--hover); color:var(--text);}
  .nav-item.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .nav-item svg{width:16px; height:16px; flex-shrink:0;}
  .nav-badge{
    margin-left:auto; font-size:11px; font-weight:600; background:var(--hover);
    color:var(--muted); border-radius:10px; padding:1px 8px; min-width:24px; text-align:center;
  }
  .nav-item.active .nav-badge{background:var(--accent); color:#fff;}
  .sidebar-footer{border-top:1px solid var(--border); padding:12px 14px; display:flex; flex-direction:column; gap:8px;}
  .save-indicator{font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px; min-height:16px;}
  .save-indicator .dot{width:7px; height:7px; border-radius:50%; background:var(--ok); flex-shrink:0;}
  .footer-actions{display:flex; gap:8px;}
  .footer-actions button{flex:1;}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; padding:34px 44px 60px;}
  .view{max-width:880px; margin:0 auto;}
  .view-header{margin-bottom:22px;}
  .view-header h1{font-size:21px; margin:0 0 6px;}
  .view-header p{margin:0; color:var(--muted); font-size:13.5px; line-height:1.55; max-width:640px;}

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:20px; margin-bottom:18px; box-shadow:var(--shadow);
  }
  .card h2{font-size:14.5px; margin:0 0 6px;}
  .card .hint{font-size:12.5px; color:var(--muted); margin:0 0 14px; line-height:1.5;}

  /* ---------- Buttons & inputs ---------- */
  button{
    font:inherit; font-size:13px; padding:7px 14px; border-radius:8px;
    border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer;
  }
  button:hover{background:var(--hover);}
  button.primary{background:var(--accent); color:#fff; border-color:transparent;}
  button.primary:hover{background:var(--accent-hover);}
  button.danger{color:var(--danger); border-color:var(--danger-soft);}
  button.danger:hover{background:var(--danger-soft);}
  button.ghost{border-color:transparent; background:none; color:var(--muted);}
  button.ghost:hover{background:var(--hover); color:var(--text);}
  input[type=text], textarea{
    width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px;
    font-size:13px; font-family:inherit; color:var(--text); background:var(--input-bg);
    resize:vertical;
  }
  input[type=text]:focus, textarea:focus{outline:2px solid var(--accent-soft); border-color:var(--accent);}

  /* ---------- List editor ---------- */
  .list-toolbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap;}
  .filter-wrap{position:relative; flex:1; max-width:280px;}
  .filter-wrap input{padding-left:30px;}
  .filter-wrap svg{
    position:absolute; left:9px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; color:var(--muted); pointer-events:none;
  }
  .col-headers{
    display:grid; grid-template-columns:26px 1fr 1fr 96px; gap:10px; font-size:11.5px;
    color:var(--muted); font-weight:600; padding:0 12px 6px; letter-spacing:.02em;
  }
  .rows{}
  .row{
    display:grid; grid-template-columns:26px 1fr 1fr 96px; gap:10px; align-items:start;
    padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px;
    background:var(--card); box-shadow:var(--shadow);
  }
  .col-headers.cols-4, .row.cols-4{grid-template-columns:26px 1.3fr 1fr .8fr .8fr 96px;}
  .row input{min-width:0;}
  .row.dragging{opacity:.45; border-style:dashed;}
  .row textarea{min-height:36px;}
  .drag-handle{
    cursor:grab; color:var(--muted); padding-top:9px; text-align:center; user-select:none;
    font-size:13px; letter-spacing:1px; touch-action:none;
  }
  .drag-handle:active{cursor:grabbing;}
  .row-actions{display:flex; gap:2px; align-items:center; padding-top:3px; justify-content:flex-end;}
  .icon-btn{
    width:28px; height:28px; padding:0; display:flex; align-items:center; justify-content:center;
    border:none; background:none; border-radius:7px; color:var(--muted); font-size:13px;
  }
  .icon-btn:hover{background:var(--hover); color:var(--text);}
  .icon-btn.del:hover{background:var(--danger-soft); color:var(--danger);}

  .empty-state{
    border:1.5px dashed var(--border); border-radius:12px; padding:38px 20px; text-align:center;
    color:var(--muted); font-size:13.5px;
  }
  .empty-state .big{font-size:26px; margin-bottom:8px;}
  .empty-state button{margin-top:14px;}
  .add-row-btn{margin-top:4px;}

  /* ---------- Import / Export ---------- */
  .dropzone{
    border:1.5px dashed var(--border); border-radius:12px; padding:26px 18px; text-align:center;
    color:var(--muted); font-size:13.5px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.drag-over{border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}
  .dropzone .sub{font-size:12px; margin-top:4px;}
  details{margin-top:12px;}
  details summary{cursor:pointer; font-size:13px; color:var(--accent); user-select:none;}
  textarea#pasteArea{min-height:120px; font-family:var(--mono); font-size:12px; margin-top:10px;}
  .toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .toggle-label{display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer; user-select:none;}
  .stats-line{font-size:12.5px; color:var(--muted); margin:10px 0 0; line-height:1.6;}
  .stats-line .warn-text{color:var(--warn); font-weight:600;}
  .status{font-size:12.5px; margin-top:8px; min-height:16px;}
  .status.ok{color:var(--ok);}
  .status.err{color:var(--danger);}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--text); color:var(--bg);
    padding:10px 16px; border-radius:9px; font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,.25);
    opacity:0; transform:translateY(8px); transition:opacity .2s, transform .2s; pointer-events:none;
    z-index:50;
  }
  .toast.show{opacity:1; transform:none;}

  /* ---------- Responsive ---------- */
  @media (max-width:760px){
    body{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:static; border-right:none; border-bottom:1px solid var(--border);}
    .nav{display:flex; flex-wrap:wrap; gap:2px; padding:4px 10px 10px;}
    .nav-label{display:none;}
    .nav-item{width:auto;}
    .main{padding:22px 16px 50px;}
    .row, .col-headers{grid-template-columns:22px 1fr 1fr 60px;}
    .row.cols-4, .col-headers.cols-4{grid-template-columns:22px 1fr 1fr .8fr .8fr 60px;}
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="brand-logo">M</div>
    <div>
      <div class="brand-name">Mnemosyne</div>
      <div class="brand-sub">Logger settings editor</div>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="sidebar-footer">
    <div class="footer-actions">
      <button class="primary" id="btnCopyJson">Copy JSON</button>
      <button id="btnDownloadJson" title="Download logger-data.json" style="flex:0 0 auto;">⬇</button>
    </div>
    <label class="toggle-label" style="font-size:12.5px;">
      <input type="checkbox" id="singleLineToggle"> Single-line format (for Confluence)
    </label>
    <div class="save-indicator" id="saveIndicator"><span class="dot"></span><span id="saveText">All changes saved locally</span></div>
    <div class="footer-actions">
      <button class="ghost" id="themeToggle" title="Toggle dark mode">🌙 Dark</button>
      <button class="danger" id="btnClearAll">Clear all</button>
    </div>
  </div>
</aside>

<main class="main"><div class="view" id="view"></div></main>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json,application/json" style="display:none">

<script>
(function(){
  "use strict";

  // ---- Configuration ------------------------------------------------------
  // Data model & JSON output format are IDENTICAL to the previous version of
  // this tool — the extension's Update Info page reads the same keys.
  var CATEGORIES = [
    { key:"logEntries",      label:"Log Entries",      icon:"lines", type:"text",
      col1:"Short label", col2:"Full message (multi-line OK)",
      desc:"Prewritten log lines. The short label is what the user sees in the popup; the full message is what gets copied as DD.MM.YYYY_INITIALS: message." },
    { key:"linkList",        label:"Shortcut Links",   icon:"link", type:"link",
      col1:"URL", col2:"Label",
      desc:"Top shortcut links shown in the Logger's main shortcuts panel." },
    { key:"whitelabelLinks", label:"Whitelabel Links", icon:"link", type:"link",
      col1:"URL", col2:"Label",
      desc:"Whitelabel partner links shown in the Whitelabel sidebar." },
    { key:"handbookLinks",   label:"Handbook Links",   icon:"link", type:"link",
      col1:"URL", col2:"Label",
      desc:"Handbook links shown in the Handbook sidebar. URLs starting with http open in a new tab." },
    { key:"formulasLinks",   label:"Formulas Links",   icon:"link", type:"link",
      col1:"URL", col2:"Label", col3:"Category (optional)", col4:"Sub-category (optional)",
      desc:"Forms and formulas shown in the Formulas sidebar. Entries with the same category are grouped into a folder; a sub-category adds a second folder level. A sub-category without a category is ignored. Folder order follows the order of first appearance in this list." },
    { key:"copyPasteMenu",   label:"Copy/Paste Menu",  icon:"clipboard", type:"text",
      col1:"Label shown", col2:"Text copied (multi-line OK)",
      desc:"Quick copy snippets. Clicking an entry in the popup copies the text to the clipboard." },
    { key:"customTools",     label:"Custom Tools",     icon:"link", type:"link",
      col1:"URL", col2:"Tool name",
      desc:"Custom tools shown in the Logger's Tools sidebar, below the built-in ABC / MP Calculator / IBAN Validator / Compare text / Update Info. Imported by the Logger via Update Info's \"customTools\" key." }
  ];

  var ICONS = {
    lines:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
    link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
    clipboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>',
    gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M19.4 4.6l-1.8 1.8M6.4 17.6l-1.8 1.8"/></svg>',
    io:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M4 21h16"/></svg>',
    search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'
  };

  var STORAGE_KEY = "mnemosyne_data_v1";
  var THEME_KEY = "mnemosyne_theme";
  var SINGLELINE_KEY = "mnemosyne_singleline";

  // ---- State ---------------------------------------------------------------
  var state = { logCode: "" };
  CATEGORIES.forEach(function(c){ state[c.key] = []; });
  var activeView = "io"; // category key | "general" | "io" — Import is the landing page
  var filterText = "";
  var draggedRow = null;

  // ---- Helpers -------------------------------------------------------------
  function stripLinkFormat(v){
    if (typeof v !== "string") return v;
    var m = v.match(/^\[(.*)\]\((.*)\)$/s);
    if (m) return m[2] || m[1];
    return v;
  }
  function applyLinkFormat(url){
    if (!url) return url;
    return "[" + url + "](" + url + ")";
  }
  function el(tag, attrs, children){
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){ e.appendChild(c); });
    return e;
  }
  function icon(name){
    var s = el("span", { html: ICONS[name] || "" });
    s.style.display = "contents";
    return s.firstChild;
  }

  // ---- Persistence (autosave) ----------------------------------------------
  var saveTimer = null;
  function persist(){
    clearTimeout(saveTimer);
    var st = document.getElementById("saveText");
    st.textContent = "Saving…";
    saveTimer = setTimeout(function(){
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        st.textContent = "All changes saved locally";
      } catch(e) {
        st.textContent = "Could not save (storage full?)";
      }
      if (activeView === "io") refreshStats();
    }, 250);
  }
  function restore(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      loadData(JSON.parse(raw), true);
      return true;
    } catch(e) { return false; }
  }

  // ---- Load data into state -------------------------------------------------
  function loadData(data, alreadyPlain){
    state.logCode = typeof data.logCode === "string" ? data.logCode : "";
    CATEGORIES.forEach(function(c){
      var incoming = Array.isArray(data[c.key]) ? data[c.key] : [];
      state[c.key] = incoming.map(function(pair){
        var a = pair && pair[0] != null ? String(pair[0]) : "";
        var b = pair && pair[1] != null ? String(pair[1]) : "";
        if (c.type === "link" && !alreadyPlain) a = stripLinkFormat(a);
        if (!c.col3) return [a, b];
        var g = pair && pair[2] != null ? String(pair[2]) : "";
        var s = pair && pair[3] != null ? String(pair[3]) : "";
        if (!g.trim()) s = ""; // a sub-category needs a category
        return [a, b, g, s];
      });
    });
  }

  // ---- Toast ---------------------------------------------------------------
  var toastTimer = null;
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2400);
  }

  // ---- Sidebar --------------------------------------------------------------
  function renderNav(){
    var nav = document.getElementById("nav");
    nav.innerHTML = "";

    nav.appendChild(el("div", { class:"nav-label", text:"File" }));
    nav.appendChild(navItem("io", "Import", "io", null));

    nav.appendChild(el("div", { class:"nav-label", text:"Settings" }));
    nav.appendChild(navItem("general", "General", "gear", null));

    nav.appendChild(el("div", { class:"nav-label", text:"Data lists" }));
    CATEGORIES.forEach(function(c){
      nav.appendChild(navItem(c.key, c.label, c.icon, state[c.key].length));
    });
  }
  function navItem(key, label, iconName, count){
    var item = el("button", { class:"nav-item" + (activeView === key ? " active" : "") });
    item.appendChild(icon(iconName));
    item.appendChild(el("span", { text: label }));
    if (count !== null) item.appendChild(el("span", { class:"nav-badge", text: String(count) }));
    item.addEventListener("click", function(){
      activeView = key;
      filterText = "";
      renderNav();
      renderView();
    });
    return item;
  }

  // ---- Main view -------------------------------------------------------------
  function renderView(){
    var view = document.getElementById("view");
    view.innerHTML = "";
    if (activeView === "general") return renderGeneral(view);
    if (activeView === "io") return renderIO(view);
    var cat = CATEGORIES.find(function(c){ return c.key === activeView; });
    if (cat) renderCategory(view, cat);
  }

  // ---- General view ----------------------------------------------------------
  function renderGeneral(view){
    view.appendChild(viewHeader("General",
      "Settings that apply to the whole Logger, not to a single list."));

    var card = el("div", { class:"card" });
    card.appendChild(el("h2", { text:"Log Code" }));
    card.appendChild(el("p", { class:"hint",
      text:'Optional tag inserted into every copied log line, e.g. "RC" makes DD.MM.YYYY_RC_INITIALS: message. Leave blank to copy DD.MM.YYYY_INITIALS: message without a tag.' }));
    var input = el("input", { type:"text", placeholder:"e.g. RC (leave blank for none)" });
    input.style.maxWidth = "260px";
    input.value = state.logCode;
    input.addEventListener("input", function(){ state.logCode = input.value; persist(); });
    card.appendChild(input);
    view.appendChild(card);
  }

  // ---- Category view -----------------------------------------------------------
  function viewHeader(title, desc){
    var h = el("div", { class:"view-header" });
    h.appendChild(el("h1", { text: title }));
    h.appendChild(el("p", { text: desc }));
    return h;
  }

  function renderCategory(view, cat){
    view.appendChild(viewHeader(cat.label, cat.desc));

    var toolbar = el("div", { class:"list-toolbar" });
    var filterWrap = el("div", { class:"filter-wrap" });
    filterWrap.appendChild(icon("search"));
    var filterInput = el("input", { type:"text", placeholder:"Filter entries…" });
    filterInput.value = filterText;
    filterWrap.appendChild(filterInput);
    toolbar.appendChild(filterWrap);

    var addBtn = el("button", { class:"primary", text:"+ Add entry" });
    toolbar.appendChild(addBtn);
    view.appendChild(toolbar);

    var listWrap = el("div");
    view.appendChild(listWrap);

    // Autocomplete datalists for extra columns (category / sub-category)
    var dlCatId = "dl-" + cat.key + "-cat", dlSubId = "dl-" + cat.key + "-sub";
    if (cat.col3) {
      view.appendChild(el("datalist", { id: dlCatId }));
      view.appendChild(el("datalist", { id: dlSubId }));
    }
    function uniqueVals(idx, groupFilter){
      var seen = {}, out = [];
      state[cat.key].forEach(function(r){
        if (groupFilter) {
          if ((r[2]||"").trim().toLowerCase() !== groupFilter) return;
        }
        var v = (r[idx]||"").trim();
        if (!v) return;
        var k = v.toLowerCase();
        if (!seen[k]) { seen[k] = 1; out.push(v); }
      });
      return out;
    }
    function fillDatalist(id, vals){
      var dl = document.getElementById(id);
      if (!dl) return;
      dl.innerHTML = "";
      vals.forEach(function(v){ dl.appendChild(el("option", { value: v })); });
    }
    function refreshCatDatalist(){ fillDatalist(dlCatId, uniqueVals(2)); }
    function refreshSubDatalist(groupVal){
      // Scoped to the typed category (case-insensitive); all sub-categories if none typed.
      fillDatalist(dlSubId, uniqueVals(3, (groupVal||"").trim().toLowerCase()));
    }

    function drawList(){
      listWrap.innerHTML = "";
      var rows = state[cat.key];

      if (rows.length === 0) {
        var empty = el("div", { class:"empty-state" });
        empty.appendChild(el("div", { class:"big", text:"✨" }));
        empty.appendChild(el("div", { text:"Nothing here yet." }));
        var eBtn = el("button", { class:"primary", text:"+ Add the first entry" });
        eBtn.addEventListener("click", addEntry);
        empty.appendChild(eBtn);
        listWrap.appendChild(empty);
        return;
      }

      var headers = [
        el("div", { text:"" }),
        el("div", { text: cat.col1 }),
        el("div", { text: cat.col2 })
      ];
      if (cat.col3) {
        headers.push(el("div", { text: cat.col3 }));
        headers.push(el("div", { text: cat.col4 }));
      }
      headers.push(el("div", { text:"", style:"text-align:right" }));
      listWrap.appendChild(el("div", { class:"col-headers" + (cat.col3 ? " cols-4" : "") }, headers));

      var container = el("div", { class:"rows" });
      container.addEventListener("dragover", function(e){
        e.preventDefault();
        if (!draggedRow) return;
        var after = rowAfter(container, e.clientY);
        if (after == null) container.appendChild(draggedRow);
        else container.insertBefore(draggedRow, after);
      });

      rows.forEach(function(item){
        container.appendChild(makeRow(cat, item, container));
      });
      listWrap.appendChild(container);
      applyFilter(container);
    }

    function addEntry(){
      state[cat.key].push(cat.col3 ? ["", "", "", ""] : ["", ""]);
      persist();
      renderNav();
      drawList();
      var inputs = listWrap.querySelectorAll(".row input, .row textarea");
      var container = listWrap.querySelector(".rows");
      if (container && container.lastChild) {
        var first = container.lastChild.querySelector("input, textarea");
        if (first) first.focus();
        if (container.lastChild.scrollIntoView) container.lastChild.scrollIntoView({ block:"nearest" });
      }
    }
    addBtn.addEventListener("click", addEntry);

    filterInput.addEventListener("input", function(){
      filterText = filterInput.value;
      var container = listWrap.querySelector(".rows");
      if (container) applyFilter(container);
    });

    function applyFilter(container){
      var f = filterText.trim().toLowerCase();
      Array.prototype.forEach.call(container.children, function(rowEl){
        if (!f) { rowEl.style.display = ""; return; }
        var item = rowEl._item || ["",""];
        var hit = item.some(function(v){ return (v||"").toLowerCase().indexOf(f) !== -1; });
        rowEl.style.display = hit ? "" : "none";
      });
    }

    function makeRow(c, item, container){
      var rowEl = el("div", { class:"row" + (c.col3 ? " cols-4" : "") });
      rowEl._item = item;

      var handle = el("div", { class:"drag-handle", title:"Drag to reorder", text:"⠰" });
      handle.addEventListener("pointerdown", function(){ rowEl.draggable = true; });
      rowEl.addEventListener("dragstart", function(e){
        draggedRow = rowEl;
        rowEl.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", ""); } catch(err){}
      });
      rowEl.addEventListener("dragend", function(){
        rowEl.classList.remove("dragging");
        rowEl.draggable = false;
        draggedRow = null;
        // Commit new order from the DOM
        state[c.key] = Array.prototype.map.call(container.querySelectorAll(".row"), function(r){ return r._item; });
        persist();
        drawList();
      });

      var field1 = el("input", { type:"text",
        placeholder: c.type === "link" ? "https://…" : c.col1 });
      field1.value = item[0] || "";
      field1.addEventListener("input", function(){ item[0] = field1.value; persist(); });

      var field2;
      if (c.type === "link") {
        field2 = el("input", { type:"text", placeholder: c.col2 });
      } else {
        field2 = el("textarea", { placeholder: c.col2 });
      }
      field2.value = item[1] || "";
      field2.addEventListener("input", function(){ item[1] = field2.value; persist(); });

      var field3 = null, field4 = null;
      if (c.col3) {
        field3 = el("input", { type:"text", placeholder:"Category…", list: dlCatId, title: c.col3 });
        field3.value = item[2] || "";
        field3.addEventListener("focus", refreshCatDatalist);
        field3.addEventListener("input", function(){
          item[2] = field3.value;
          refreshSubDatalist(field3.value);
          persist();
        });

        field4 = el("input", { type:"text", placeholder:"Sub-category…", list: dlSubId, title: c.col4 });
        field4.value = item[3] || "";
        field4.addEventListener("focus", function(){ refreshSubDatalist(field3.value); });
        field4.addEventListener("input", function(){ item[3] = field4.value; persist(); });
      }

      var upBtn = el("button", { class:"icon-btn", title:"Move up", text:"↑" });
      upBtn.addEventListener("click", function(){
        var arr = state[c.key], i = arr.indexOf(item);
        if (i <= 0) return;
        arr[i] = arr[i-1]; arr[i-1] = item;
        persist(); drawList();
      });
      var downBtn = el("button", { class:"icon-btn", title:"Move down", text:"↓" });
      downBtn.addEventListener("click", function(){
        var arr = state[c.key], i = arr.indexOf(item);
        if (i === -1 || i === arr.length-1) return;
        arr[i] = arr[i+1]; arr[i+1] = item;
        persist(); drawList();
      });
      var delBtn = el("button", { class:"icon-btn del", title:"Delete entry", text:"✕" });
      delBtn.addEventListener("click", function(){
        var arr = state[c.key], i = arr.indexOf(item);
        if (i !== -1) arr.splice(i, 1);
        persist(); renderNav(); drawList();
      });

      rowEl.appendChild(handle);
      rowEl.appendChild(field1);
      rowEl.appendChild(field2);
      if (field3) rowEl.appendChild(field3);
      if (field4) rowEl.appendChild(field4);
      rowEl.appendChild(el("div", { class:"row-actions" }, [upBtn, downBtn, delBtn]));
      return rowEl;
    }

    drawList();
  }

  function rowAfter(container, y){
    var els = container.querySelectorAll(".row:not(.dragging)");
    var closest = null, closestOffset = -Infinity;
    Array.prototype.forEach.call(els, function(child){
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closestOffset) { closestOffset = offset; closest = child; }
    });
    return closest;
  }

  // ---- Import / Export view -----------------------------------------------------
  function renderIO(view){
    view.appendChild(viewHeader("Import",
      "Load an existing logger-data.json to edit it. When you're done, use “Copy JSON” in the sidebar to export. Everything you edit is also autosaved in this browser."));

    // Import card — paste JSON is the default, file upload underneath
    var impCard = el("div", { class:"card" });
    impCard.appendChild(el("h2", { text:"Import" }));
    impCard.appendChild(el("p", { class:"hint", text:"Paste the JSON code and load it — replaces everything currently in the editor." }));

    var pasteArea = el("textarea", { id:"pasteArea", placeholder:"Paste JSON here…" });
    impCard.appendChild(pasteArea);
    var pasteBar = el("div", { class:"toolbar", style:"margin-top:8px;" });
    var pasteBtn = el("button", { class:"primary", text:"Load pasted JSON" });
    pasteBtn.addEventListener("click", function(){
      var raw = pasteArea.value.trim();
      if (!raw) { setStatus("importStatus", "Paste some JSON first.", true); return; }
      importText(raw, "pasted JSON");
    });
    pasteBar.appendChild(pasteBtn);
    impCard.appendChild(pasteBar);

    impCard.appendChild(el("p", { class:"hint", style:"margin:16px 0 8px;", text:"Or upload a file:" }));
    var dz = el("div", { class:"dropzone" });
    dz.appendChild(el("div", { text:"Drop a .json file here, or click to browse" }));
    dz.appendChild(el("div", { class:"sub", text:"e.g. logger-data.json exported earlier or copied from the shared page" }));
    var fileInput = document.getElementById("fileInput");
    dz.addEventListener("click", function(){ fileInput.value = ""; fileInput.click(); });
    dz.addEventListener("dragover", function(e){ e.preventDefault(); dz.classList.add("drag-over"); });
    dz.addEventListener("dragleave", function(){ dz.classList.remove("drag-over"); });
    dz.addEventListener("drop", function(e){
      e.preventDefault(); dz.classList.remove("drag-over");
      var f = e.dataTransfer.files[0];
      if (f) importFile(f);
    });
    fileInput.onchange = function(){ if (fileInput.files[0]) importFile(fileInput.files[0]); };
    impCard.appendChild(dz);

    impCard.appendChild(el("div", { class:"status", id:"importStatus" }));
    view.appendChild(impCard);

    // Content overview / warnings
    var statsCard = el("div", { class:"card" });
    statsCard.appendChild(el("h2", { text:"Current content" }));
    statsCard.appendChild(el("div", { class:"stats-line", id:"statsLine" }));
    view.appendChild(statsCard);

    refreshStats();
  }

  function importFile(file){
    var reader = new FileReader();
    reader.onerror = function(){ setStatus("importStatus", "Could not read " + file.name + ".", true); };
    reader.onload = function(){ importText(reader.result, file.name); };
    reader.readAsText(file);
  }
  function importText(raw, sourceName){
    try {
      var parsed = JSON.parse(raw);
      loadData(parsed);
      persist();
      renderNav();
      renderView();
      var total = CATEGORIES.reduce(function(n,c){ return n + state[c.key].length; }, 0);
      setStatus("importStatus", "Imported " + sourceName + " — " + total + " entries loaded.", false);
      toast("Import successful");
    } catch(e) {
      setStatus("importStatus", "Invalid JSON: " + e.message, true);
    }
  }

  function setStatus(elId, msg, isErr){
    var s = document.getElementById(elId);
    if (!s) return;
    s.textContent = msg;
    s.className = "status " + (isErr ? "err" : "ok");
  }

  // ---- Output generation (format identical to previous version) -----------------
  function buildOutputObject(){
    var out = { logCode: state.logCode || "" };
    CATEGORIES.forEach(function(c){
      out[c.key] = state[c.key]
        .filter(function(row){ return (row[0]||"").trim() || (row[1]||"").trim(); })
        .map(function(row){
          var a = row[0] || "";
          var b = row[1] || "";
          if (c.type === "link" && a) a = applyLinkFormat(a);
          if (!c.col3) return [a, b];
          // Extension format: [url, label] | [url, label, category] | [url, label, category, subcategory]
          var g = (row[2] || "").trim();
          var s = (row[3] || "").trim();
          if (!g) return [a, b];          // sub-category without a category is dropped
          if (!s) return [a, b, g];
          return [a, b, g, s];
        });
    });
    return out;
  }

  // Single-line JSON with spacing that matches the shared Confluence page.
  function compactStringify(value){
    if (Array.isArray(value)) {
      if (!value.length) return "[]";
      return "[ " + value.map(compactStringify).join(", ") + " ]";
    }
    if (value && typeof value === "object") {
      var keys = Object.keys(value);
      if (!keys.length) return "{}";
      return "{ " + keys.map(function(k){ return JSON.stringify(k) + ": " + compactStringify(value[k]); }).join(", ") + " }";
    }
    return JSON.stringify(value);
  }

  function buildOutputText(){
    var obj = buildOutputObject();
    var single = document.getElementById("singleLineToggle");
    return (single && single.checked) ? compactStringify(obj) : JSON.stringify(obj, null, 2);
  }

  function refreshStats(){
    var stats = document.getElementById("statsLine");
    if (stats) {
      var obj = buildOutputObject();
      var parts = CATEGORIES.map(function(c){ return obj[c.key].length + " " + c.label.toLowerCase(); });
      var orphanCount = 0;
      CATEGORIES.forEach(function(c){
        if (!c.col3) return;
        state[c.key].forEach(function(row){
          if ((row[3]||"").trim() && !(row[2]||"").trim()) orphanCount++;
        });
      });
      stats.innerHTML = "";
      stats.appendChild(document.createTextNode(parts.join(" · ")));
      if (orphanCount) {
        stats.appendChild(document.createTextNode(" · "));
        stats.appendChild(el("span", { class:"warn-text",
          text: orphanCount + (orphanCount === 1 ? " entry has" : " entries have") + " a sub-category without a category (won't be exported)" }));
      }
    }
  }

  // ---- Sidebar export (Copy JSON / Download / single-line toggle) -----------
  var singleLineCb = document.getElementById("singleLineToggle");
  singleLineCb.checked = localStorage.getItem(SINGLELINE_KEY) !== "0"; // checked by default
  singleLineCb.addEventListener("change", function(){
    localStorage.setItem(SINGLELINE_KEY, singleLineCb.checked ? "1" : "0");
  });

  document.getElementById("btnCopyJson").addEventListener("click", function(){
    var text = buildOutputText();
    var done = function(){ toast("JSON copied to clipboard"); };
    var fail = function(){
      // Fallback: hidden textarea + execCommand
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); }
      catch(e){ toast("Could not copy — use Download instead"); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fail);
    } else {
      fail();
    }
  });

  document.getElementById("btnDownloadJson").addEventListener("click", function(){
    var blob = new Blob([buildOutputText()], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "logger-data.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("Downloaded logger-data.json");
  });

  // ---- Theme ---------------------------------------------------------------
  function applyTheme(theme){
    document.documentElement.setAttribute("data-theme", theme);
    var btn = document.getElementById("themeToggle");
    btn.textContent = theme === "dark" ? "☀️ Light" : "🌙 Dark";
    localStorage.setItem(THEME_KEY, theme);
  }
  document.getElementById("themeToggle").addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    applyTheme(cur === "dark" ? "light" : "dark");
  });

  // ---- Clear all -------------------------------------------------------------
  document.getElementById("btnClearAll").addEventListener("click", function(){
    if (!confirm("Clear all entries in every category (including the Log Code)?\nThis also removes the autosaved copy in this browser.")) return;
    state.logCode = "";
    CATEGORIES.forEach(function(c){ state[c.key] = []; });
    localStorage.removeItem(STORAGE_KEY);
    document.getElementById("saveText").textContent = "All changes saved locally";
    renderNav();
    renderView();
    toast("Everything cleared");
  });

  // ---- Init --------------------------------------------------------------------
  var storedTheme = localStorage.getItem(THEME_KEY);
  applyTheme(storedTheme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  restore();
  renderNav();
  renderView();
})();
</script>
</body>
